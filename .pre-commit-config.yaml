# Хуки намеренно local, а не ruff-pre-commit с пином версии: пин (v0.12.0) расходился с
# установленным ruff (0.17.0), и форматирование из pre-commit отличалось от `make format`.
# Линтер один — тот, что на PATH, как в Makefile.
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff check
        entry: ruff
        args: [check, --fix]
        language: system
        types_or: [python]
      - id: ruff-format
        name: ruff format
        entry: ruff
        args: [format]
        language: system
        types_or: [python]
